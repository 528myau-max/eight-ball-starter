<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic 8 Ball</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Ask a Question</h1>
  </header>

  <main class="workspace">
    <section class="steps" aria-label="How it works">
      <article class="step-card">
        <span class="step-number">1</span>
        <h2>Enter your name</h2>
      </article>

      <article class="step-card">
        <span class="step-number">2</span>
        <h2>Ask a question</h2>
      </article>

      <article class="step-card">
        <span class="step-number">3</span>
        <h2>Get an answer</h2>
      </article>
    </section>

    <section class="form-panel">
      <label for="nameInput">Enter Name:</label>
      <input id="nameInput" type="text" placeholder="name">

      <label for="questionInput">Your yes-or-no question:</label>
      <input id="questionInput" type="text" placeholder="question">

      <button id="askButton" type="button" onclick="askEightBall()">
        Ask the 8 Ball
      </button>
    </section>

    <section class="answer-panel" aria-live="polite">
      <p id="greeting" class="greeting">Hello!</p>
      <p id="questionOut" class="question-out">Your question will appear here.</p>

      <div class="ball">
        <div class="window">
          <p id="answer" class="answer">8</p>
        </div>
      </div>

      <div id="answerType" class="answer-type"></div>
    </section>
  </main>

  <footer class="page-footer">By Matthew Yau</footer>

  <script src="script.js"></script>
</body>
</html>
